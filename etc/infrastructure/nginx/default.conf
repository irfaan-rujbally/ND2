# Plain HTTP: serves the ACME challenge, redirects everything else to HTTPS.
server {
    listen       80;
    server_name  app.nouveauxdemocrates.com;

    # Certbot writes its challenge files under public/.well-known. This must
    # stay reachable over plain HTTP or the 90 day renewal fails.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/crm/public;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen       443 ssl;
    http2        on;
    server_name  app.nouveauxdemocrates.com;

    ssl_certificate     /etc/letsencrypt/live/app.nouveauxdemocrates.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.nouveauxdemocrates.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 100M;
    root /var/www/crm/public;

    location /storage/images/ {
        alias /var/www/crm/storage/app/public/images/;
        try_files $uri $uri/ /index.php?$query_string;
    }

    rewrite ^/index\.php/?(.*)$ /$1 permanent;

    try_files $uri @rewriteapp;

    location @rewriteapp {
        rewrite ^(.*)$ /index.php/$1 last;
    }

    location ~ ^/(index)\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # This vhost terminates TLS and talks to PHP over FastCGI, not a proxy,
        # so X-Forwarded-Proto is not what tells Laravel the scheme -- this is.
        # Without it every generated URL comes out as http:// on an https page.
        fastcgi_param  HTTPS on;
        fastcgi_index index.php;
        send_timeout 1800;
        fastcgi_read_timeout 1800;
        fastcgi_pass php:9000;
    }
}
