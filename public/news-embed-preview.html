<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>News page — Facebook embed preview</title>
    <style>
        :root { color-scheme: light; }
        body { margin: 0; background: #f6f7f9; color: #0b1220; font: 15px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
        .page { margin: 0 auto; max-width: 880px; padding: 32px 20px 64px; }
        .eyebrow { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; color: #c8102e; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
        .eyebrow::before { content: ""; width: 24px; height: 1px; background: #c8102e; }
        h1 { margin: 0; font-size: 28px; letter-spacing: -.01em; }
        .sub { margin: 4px 0 24px; color: #64748b; font-size: 14px; }
        .frame { overflow: hidden; border: 1px solid #e2e8f0; border-radius: 12px; background: #fff; min-height: 720px; }
        .note { margin-top: 16px; color: #64748b; font-size: 12px; }
    </style>
</head>
<body>
    <div id="fb-root"></div>
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js#xfbml=1&version=v23.0"></script>

    <div class="page">
        <div class="eyebrow">Official feed</div>
        <h1>Latest news</h1>
        <p class="sub">Updates from Nouveaux Démocrates on Facebook.</p>

        <div class="frame">
            <div
                class="fb-page"
                data-href="https://www.facebook.com/nouveauxdemocrate"
                data-tabs="timeline"
                data-width="500"
                data-height="720"
                data-small-header="false"
                data-adapt-container-width="true"
                data-hide-cover="false"
                data-show-facepile="true"></div>
        </div>

        <p class="note">Throwaway preview of the Page Plugin at the news page's width. Delete public/news-embed-preview.html when done.</p>
    </div>
</body>
</html>
