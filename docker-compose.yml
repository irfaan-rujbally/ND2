# sudo docker-compose up -d
version: "3.9"
services:
  php:
    #image: php:8.1-fpm
    build: './etc/infrastructure/php'
    # Named explicitly so the scheduler below can share it rather than build and
    # keep a second copy of the same image.
    image: nd2-php
    container_name: crm_php
    volumes:
    - ./etc/.bashrc:/root/.bashrc
    - .:/var/www/crm/
    - ./etc/infrastructure/nginx/conf.d:/etc/nginx/conf.d/
    working_dir: /var/www/crm/
    links:
    - db
    - cache
  # Runs Laravel's scheduler (see routes/console.php). `schedule:work` is the
  # framework's own foreground loop -- it wakes every minute and runs whatever is
  # due -- so this needs no crontab inside the image and its output goes to
  # `docker compose logs scheduler` like any other service.
  #
  # Same image and same bind mount as php, so a `git pull` reaches it too and
  # only the PHP container's rebuild has to be kept in step. It serves no
  # traffic, which is why nginx does not link to it and no port is published.
  scheduler:
    build: './etc/infrastructure/php'
    image: nd2-php
    container_name: crm_scheduler
    # The whole point is to be running at 03:00 on a Sunday without anyone
    # watching, so it comes back from a reboot or a crash on its own.
    restart: always
    volumes:
    - ./etc/.bashrc:/root/.bashrc
    - .:/var/www/crm/
    working_dir: /var/www/crm/
    command: php artisan schedule:work
    links:
    - db
    - cache
    depends_on:
    - db
    - cache
  web:
    #image: nginx:stable
    build: './etc/infrastructure/nginx'
    container_name: crm_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
    - ./etc/.bashrc:/root/.bashrc
    - .:/var/www/crm/
    - ./etc/infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf
    - ./etc/infrastructure/nginx/conf.d:/etc/nginx/conf.d/
    # Let's Encrypt certificates, issued on the host by certbot. Read only: the
    # container serves them and must never be able to alter them.
    - /etc/letsencrypt:/etc/letsencrypt:ro
    links:
    - cache
    - db
    - php
    depends_on:
    - php
  cache:
    image: redis
    container_name: crm_cache
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ./etc/infrastructure/redis/redis.conf:/etc/redis/redis.conf
  db:
    image: mariadb:latest
    container_name: crm_db
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    # Loopback only. The app reaches the database as `crm_db` over the Docker
    # network and needs no published port at all; this mapping exists purely so
    # a GUI client can connect through an SSH tunnel. Never write "3306:3306"
    # here -- that binds 0.0.0.0 and puts the members table on the public
    # internet, which is exactly how it was found.
    ports:
      - "127.0.0.1:3306:3306"
    env_file:
      - .env
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_PASSWORD}  # Add this line
volumes:
  db_data:
